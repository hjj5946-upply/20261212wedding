<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wc.ico" />

    <!-- 폰트: index.css의 @import를 여기로 옮김 (CSS→CSS 요청 체인 제거) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!-- 인트로 프레임 순서가 열 때마다 랜덤이라 특정 파일을 선점해도 첫 프레임이 아니다.
         (프리로드는 IntroHost 의 usePreloadImages 가 실제 재생 순서대로 처리한다) -->

    <!-- 다크모드 추적 금지: 기기 설정이 다크여도 항상 라이트 팔레트로 그린다.
         (안드로이드 크롬/삼성 인터넷의 자동 다크 테마도 "only light" 로 opt-out 된다) -->
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#ffffff" />

    <!-- 뷰포트 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <title>2026.12.12 정준 ♥ 송희</title>

    <!-- Open Graph (카카오톡 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="저희 결혼해요. 정준 ♥ 송희" />
    <meta property="og:description" content="2026년 12월 12일 - 까사그랑데 센트로" />
    <meta property="og:image" content="https://jjsh-261212.com/images/og_image.webp" />
    <meta property="og:url" content="https://jjsh-261212.com" />
    <meta property="og:locale" content="ko_KR" />

    <!-- 트위터 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="저희 결혼해요. 정준 ♥ 송희" />
    <meta name="twitter:description" content="2026년 12월 12일 - 까사그랑데 센트로" />
    <meta name="twitter:image" content="https://jjsh-261212.com/images/og_image.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
